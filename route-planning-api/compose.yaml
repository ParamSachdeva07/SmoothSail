services:
  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - tideline_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  tideline_mongo:
