[project]
name = "tideline"
version = "0.1.0"
description = "Maritime route comparison and data ingestion"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "pymongo>=4.11,<5",
  "networkx>=3.4,<4",
  "shapely>=2.0,<3",
  "pyproj>=3.7,<4",
  "xarray>=2025.1",
  "scipy>=1.15,<2",
  "h5netcdf[h5py]>=1.5,<2",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "pyshp>=2.3,<4",
  "pypdf>=6,<7",
  "defusedxml>=0.7,<1",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.4,<5",
]
[project.optional-dependencies]
providers = [
    "copernicusmarine>=2.5,<3",
    "ecmwf-opendata>=0.3,<1",
    "cfgrib>=0.9,<1",
    "eccodes>=2.40,<3",
    "eccodeslib>=2.40,<3",
]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["service"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
